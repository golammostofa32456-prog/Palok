name: Build PALOK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate PALOK app icon
        working-directory: mobile
        run: dart run flutter_launcher_icons

      - name: Show Android signing fingerprints
        working-directory: mobile/android
        shell: bash
        run: |
          set -e

          echo "Checking Android Gradle files..."

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "gradlew not found. Listing Android directory:"
            ls -la
            exit 1
          fi

          echo ""
          echo "===== SHA-1 / SHA-256 ====="
          echo ""

          ./gradlew signingReport

      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: palok-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
