name: palok
description: PALOK short video app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # Video
  video_player: ^2.9.5

  # Image / Video picking
  image_picker: ^1.1.2

  # HTTP / Cloudinary upload
  http: ^1.6.0

  # Native share
  share_plus: ^11.0.0

  # SVG icons
  flutter_svg: ^2.0.17

  # Google Login
  google_sign_in: ^6.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # App icon generator
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  flutter_launcher_icons:
    android: true
    ios: false
    image_path: "assets/icon/palok_icon.png"
    adaptive_icon_background: "#000000"
    adaptive_icon_foreground: "assets/icon/palok_icon.png"
